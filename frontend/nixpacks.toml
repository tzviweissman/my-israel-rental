# Railway build config for the CRA/craco frontend.
#
# CI=false: Railway (like any CI system) sets CI=true, and CRA's react-scripts
# treats every ESLint warning as a hard build error under that flag. The repo
# has ~18 pre-existing react-hooks/exhaustive-deps warnings across ~13 files —
# real code-quality debt worth cleaning up, but not something that should
# block every deploy. Same pragmatic default Vercel/Netlify/Heroku CRA
# buildpacks use.
[variables]
CI = "false"

# --legacy-peer-deps is required: react-day-picker@8.10.1 declares a peer on
# date-fns ^2||^3, but the app pins date-fns ^4. Works fine in practice; a
# plain `npm install` aborts on the peer-dependency conflict.
[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
# CRA's own `npm start` is a dev server — wrong for production (slow,
# unoptimized, not meant to be internet-facing). Serve the static build
# instead. $PORT is read by server.js at runtime.
#
# `server.js` rather than `npx serve -s build`, and the difference is one
# feature: it can tell a link-preview crawler from a person, which a static
# host cannot. Everything else — the same files, the same SPA fallback, the
# same headers and redirects out of serve.json — is unchanged, and the
# crawler branch fails open to exactly what `serve` would have returned.
# See the comment at the top of frontend/server.js.
cmd = "node server.js"
