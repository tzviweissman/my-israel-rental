<svg xmlns="http://www.w3.org/2000/svg" width="232" height="64" viewBox="0 0 232 64" role="img" aria-label="Find us on MyIsraelRental">
  <title>Find us on MyIsraelRental</title>
  <rect x="0.5" y="0.5" width="231" height="63" rx="14" fill="#000000" stroke="#000000"/>
  <g transform="translate(12 12) scale(0.3333333333333333)">
    <rect x="4" y="4" width="112" height="112" rx="30" fill="#143C5A"/>
    <rect x="33" y="60" width="14" height="30" rx="6" fill="#7CA8C8"/>
    <rect x="53" y="44" width="14" height="46" rx="6" fill="#FFFFFF"/>
    <rect x="73" y="30" width="14" height="60" rx="6" fill="#C9A227"/>
  </g>
  <!-- In right-to-left text "start" is the right edge, so the Hebrew line
       anchors at start; the English name below anchors at end. -->
  <text x="64" y="28" text-anchor="start" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#D1D5DB">Find us on</text>
  <text x="64" y="47" text-anchor="start" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">MyIsraelRental</text>
</svg>
