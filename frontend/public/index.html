<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Standard responsive viewport. Pinch-to-zoom is intentionally
             ALLOWED for accessibility (WCAG 2.1 SC 1.4.4 / 1.4.10) —
             users with low vision must be able to zoom the page. The
             "input focus auto-zooms the whole page" bug is prevented
             separately by the 16px min-font-size rule on all form
             controls in index.css (@media max-width: 640px), so we
             don't need a blanket zoom lock here. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#1E5F8C" />
        <!-- Favicon from the gold mark. %PUBLIC_URL% is substituted by CRA at
             build time; a bare "/favicon.png" breaks under a sub-path deploy. -->
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
        <!-- NOTE: per-route <title>, <meta name="description">, og:* and
             twitter:* tags are now injected by react-helmet-async on each
             page (see /src/components/PageMeta.jsx). The site_name +
             og:type stay here because they're constant across routes
             and Helmet won't duplicate them. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MyIsraelRental" />
        <!-- og:image itself must be HERE, statically: preview crawlers
      (WhatsApp, Facebook, Telegram) never run JS, so the copy React
      injects at runtime is invisible to them. Until this line existed,
      the three tags below described an image that was never declared,
      and every shared link previewed with no image at all. -->
    <meta property="og:image" content="https://myisraelrental.com/brand-logo.png" />
    <meta property="og:image:alt" content="MyIsraelRental logo" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
        <!-- The API lives on a different origin from the site (Railway vs.
             myisraelrental.com), so without this the first XHR of every cold
             load pays a full DNS + TCP + TLS handshake before a byte moves.
             `%REACT_APP_BACKEND_URL%` is substituted at build time by CRA's
             InterpolateHtmlPlugin (same mechanism as %PUBLIC_URL%) — CRA feeds
             it every REACT_APP_* var, so this resolves to the same origin
             axios talks to instead of a hardcoded host that drifts.
             `crossorigin` is required: our API calls are anonymous CORS
             requests (bearer token in a header, no cookies), and a preconnect
             without it opens a connection in the wrong credentials mode that
             the actual request then can't reuse.
             If the var is ever unset at build time the placeholder is left
             verbatim, which the browser resolves as a same-origin relative
             URL — a no-op preconnect, not a broken tag. -->
        <link rel="preconnect" href="%REACT_APP_BACKEND_URL%" crossorigin />
        <!-- dns-prefetch fallback for browsers that ignore preconnect. -->
        <link rel="dns-prefetch" href="%REACT_APP_BACKEND_URL%" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <!-- Fallback title for the brief window before React hydrates +
             for crawlers that don't execute JS. Per-route titles come
             from PageMeta. -->
        <title>MyIsraelRental — Rentals across Israel</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <!-- No third-party analytics. A PostHog snippet lived here from
             29 Mar 2026 (added by Emergent while the site was hosted there),
             sending every page view AND session recordings to an account
             that was never ours. Removed 18 Sep 2026. Visitor numbers now
             come from our own counter (components/SiteVisitTracker.jsx),
             which stores no page, IP or identity. Before adding any tracker
             back here, list it on the /terms page. -->
    </body>
</html>
