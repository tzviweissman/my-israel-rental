[mypy]
python_version = 3.11
# Enable the Pydantic plugin so callers of PropertyCreate / BookingCreate /
# etc. get full field-level type checking (wrong field name → error, wrong
# type in kwargs → error, required-field omission → error).
plugins = pydantic.mypy

# Pragmatic, ratcheting config: we require annotations on all defs, but
# don't strictly check types *inside* bodies yet. This gives us a guarantee
# of coverage without forcing a massive body-level rewrite.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = False
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = True
# We use `from models import *` in routes — that's a pragma, not a typing error.
implicit_reexport = True
# Third-party libs without stubs — don't fail on them.
ignore_missing_imports = True
# Avoid walking uploads / fonts / tests during type-coverage gate.
exclude = (?x)(
    ^uploads/|
    ^fonts/|
    ^__pycache__/
  )

# models.py uses Pydantic v2 — its mypy plugin is optional; we don't add it
# to keep setup trivial. The plugin is nice-to-have, not required here.

# Tests: they use fixtures + monkeypatch heavily; annotating every pytest
# fixture adds noise. Allow untyped defs inside tests only.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-emergentintegrations.*]
ignore_missing_imports = True

[mypy-postmarker.*]
ignore_missing_imports = True

[mypy-pypdf2.*]
ignore_missing_imports = True

[mypy-PyPDF2.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-motor.*]
ignore_missing_imports = True

[mypy-bcrypt]
ignore_missing_imports = True

[mypy-icalendar]
ignore_missing_imports = True
