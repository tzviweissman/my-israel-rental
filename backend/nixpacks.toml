# ⚠ THIS FILE IS NOT CURRENTLY APPLIED. Read before trusting it.
#
# The backend service is set to the RAILPACK builder in Railway, and Railpack
# does not read nixpacks.toml. (`backend/railway.json` asks for NIXPACKS, but
# a builder chosen in the service settings overrides the file.) Proven on the
# frontend, whose nixpacks.toml specified npm while the build plan ran yarn;
# the backend build for 57c34f0 shows no apt/setup phase at all.
#
# WHAT THAT COSTS: the aptPkgs below are not installed, so the `tesseract`
# BINARY is absent. `pip install pytesseract` succeeds — it is only a wrapper —
# and `utils/files.extract_text_from_image` catches the resulting error and
# returns "" with a log line. A contract uploaded as a photo therefore loses
# its extracted text silently. See docs/railway-deploy.md.
#
# KEPT, not deleted, for two reasons: it is the record of what this image
# actually needs, and switching the service back to the NIXPACKS builder makes
# it take effect again.
#
# Railway build config for the FastAPI backend.
#
# tesseract-ocr is needed by utils/files.py (extract_text_from_image) for the
# contract OCR path — it degrades to empty text without it, so contracts
# uploaded as photos would silently lose their extracted text.
# Hebrew + English trained data are both required.
[phases.setup]
nixPkgs = ["python312", "gcc"]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-heb", "tesseract-ocr-eng"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"]

[start]
cmd = "uvicorn server:app --host 0.0.0.0 --port $PORT"
