<p class="lead">Animated and video ads (dribbble, pinterest, tzvi), kept from many more watched. Each clip plays when it is on screen. Notes in ../README.md, "Moving ads".</p>

<div class="g" id="g"><figure class="c" data-s="5" data-i="build"><video src="d01.mp4" poster="d01.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">build · food</span><p>Burger builds itself: lettuce and tomato fall, patty sears, cheese drapes, onion rings drop, bun lands. Ends on the finished burger.</p><a href="https://dribbble.com/shots/27693981-Cinematic-Burger-Ad-UGC-Concept" target="_blank" rel="noopener">dribbble · Shehabub Mobin Siam</a></figcaption></figure><figure class="c" data-s="5" data-i="doodle"><video src="d09.mp4" poster="d09.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">doodle · food</span><p>A hand-drawn stick man climbs into a real photo of a rice bowl, dances on it, gets splashed and climbs out with a spoon. Name on top.</p><a href="https://dribbble.com/shots/27624419-Khichu-Food-Animation-Cafe-Social-Media-Motion-Design" target="_blank" rel="noopener">dribbble · Ronit Jain</a></figcaption></figure><figure class="c" data-s="5" data-i="drop"><video src="p034.mp4" poster="p034.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">drop · food</span><p>A burger floats down on a parachute in front of a huge BURGER word on red and lands.</p><a href="https://www.pinterest.com/pin/609323024624767616/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="eaten"><video src="d68.mp4" poster="d68.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">eaten · food</span><p>Stop motion: a khachapuri is eaten bite by bite from above until the plate is empty, then the name and a chef appear.</p><a href="https://dribbble.com/shots/26909468-Acharuli-Khachapuri-Stop-Motion-Animation-Jozys-Bakery" target="_blank" rel="noopener">dribbble · Irakli Odoshashvili</a></figcaption></figure><figure class="c" data-s="5" data-i="eaten"><video src="p107.mp4" poster="p107.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">eaten · bakery</span><p>One slice of chocolate cake on a flat plum ground, bites disappear from it one by one, then it is whole again. Loops on its own.</p><a href="https://www.pinterest.com/pin/920212136386315722/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="flavour"><video src="p009.mp4" poster="p009.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">flavour · drinks</span><p>One flavour word repeated huge behind the can (GRAPE GRAPE GRAPE), cut to the next flavour and colour, ends on PICK YOUR POP with the whole range.</p><a href="https://www.pinterest.com/pin/946178202989975259/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="game"><video src="p055.mp4" poster="p055.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">game · cafe</span><p>Coffee cups fall from the top and fill a pixel heart one cup at a time; when it is full: YOU WON! Your heart with coffee.</p><a href="https://www.pinterest.com/pin/826832812876827310/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="line"><video src="p058.mp4" poster="p058.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">line · cafe</span><p>A cafe photo with a washing line: croissant, matcha, a 20% off tag, a pastry and an Order now card hang on pegs and slide past.</p><a href="https://www.pinterest.com/pin/1044975919823070497/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="range"><video src="p101.mp4" poster="p101.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">range · drinks</span><p>NO SUGAR NO FAT stays; each bottle gets its own colour screen, then all of them in a grid, then the logo on black.</p><a href="https://www.pinterest.com/pin/911556780889854992/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="recipe"><video src="p007.mp4" poster="p007.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">recipe · food</span><p>Each ingredient falls into a bowl with its name beside it (oregano, feta, olive), then the finished dish. Ingredients named as they fall.</p><a href="https://www.pinterest.com/pin/898960775642766065/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="ring"><video src="d49.mp4" poster="d49.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">ring · shop</span><p>JUST DO IT wraps round the shoe as a 3D ring of letters that spins; the product stays still in the middle.</p><a href="https://dribbble.com/shots/27566818-Motion-Effects-Study-Nike-ad" target="_blank" rel="noopener">dribbble · Angelika Petrova</a></figcaption></figure><figure class="c" data-s="5" data-i="rise"><video src="d31.mp4" poster="d31.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">rise · food</span><p>Tilt-shift night street corner, an empty lot; the restaurant rises out of the ground as a giant burger building with a neon sign.</p><a href="https://dribbble.com/shots/27850125-Miniature-Restaurant" target="_blank" rel="noopener">dribbble · Subharthi Basu</a></figcaption></figure><figure class="c" data-s="5" data-i="split"><video src="p021.mp4" poster="p021.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">split · food</span><p>The word CHEESE split over two lines, the burger slides in between them, the yellow arches wipe the screen to the red logo.</p><a href="https://www.pinterest.com/pin/619245017543415484/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="split"><video src="p048.mp4" poster="p048.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">split · food</span><p>Half the screen the pack, half what it tastes like (cinnamon roll, eggs, latte, cereal), in that flavour&#x27;s colour with two numbers at the bottom.</p><a href="https://www.pinterest.com/pin/627407791880802795/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="story"><video src="d76.mp4" poster="d76.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">story · food</span><p>Story ad in four beats: CRAVING SOMETHING BIG? / IT&#x27;S WHAT&#x27;S INSIDE THAT COUNTS (burger splits into layers) / JUICY CHEESY PERFECTLY STACKED / ONE BIG BITE. ORDER NOW.</p><a href="https://dribbble.com/shots/27677246-Burger-Promo-Animation" target="_blank" rel="noopener">dribbble · Neha Maharjan</a></figcaption></figure><figure class="c" data-s="5" data-i="morph"><video src="t01.mp4" poster="t01.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">morph · drinks</span><p>Kenetik, 20 s, AI made. Three limes drop and stack, then turn into the can; the can is cut in three slices with fruit inside, the slices spin and snap back together in a splash; a watermelon falls, splits open and the can bursts out; the camera rolls along the label in macro; the can drops onto a set with watermelon and lime slices, then the logo. The ingredients become the product, one continuous chain of events, no words until the logo. (Was in the 16 Nov Pinterest batch as pin 5 and wrongly not kept; Tzvi sent it back.)</p><a href="https://www.pinterest.com/pin/1110981801831892903/" target="_blank" rel="noopener">pinterest · Kenetik</a></figcaption></figure><figure class="c" data-s="5" data-i="flavour"><video src="t02.mp4" poster="t02.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">flavour · food</span><p>Lay&#x27;s, 7 s. A finger balances one bag; each tap flips it to the next flavour and the whole background turns that flavour&#x27;s colour (green, yellow, orange, red), about a beat a second; ends on all the bags in a row. Best for flavours or varieties, not sizes (Tzvi).</p><span class="t">tzvi · Lay&#x27;s</span></figcaption></figure><figure class="c" data-s="5" data-i="build"><video src="n01.mp4" poster="n01.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">build · food</span><p>A cookie wafer and cream crumbs on red tumble together, assemble into an ice-cream bar, a bite is taken with crumbs flying, and it lands as the wrapped pack with brand name.</p><p class="t">Ingredients become the product, then the finished pack closes the clip.</p><a href="https://dribbble.com/shots/15876363" target="_blank" rel="noopener">dribbble · </a></figcaption></figure><figure class="c" data-s="5" data-i="build"><video src="n02.mp4" poster="n02.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">build · food</span><p>Hundreds of chip slices fall and swirl through the air, gather into a bag that lands centre screen, then cut to the brand logo on a matching green.</p><p class="t">One cause (falling pieces) builds the product; the colour of the ingredient is the colour of the ending.</p><a href="https://dribbble.com/shots/24046792" target="_blank" rel="noopener">dribbble · </a></figcaption></figure><figure class="c" data-s="5" data-i="build"><video src="n03.mp4" poster="n03.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">build · food</span><p>A bar flies in through a ribbon of chocolate with cereal pieces orbiting, the pieces settle around it and it holds big and clear on blue.</p><p class="t">A swirl of the real ingredients around one big product reads as taste with no words.</p><a href="https://dribbble.com/shots/27319238" target="_blank" rel="noopener">dribbble · </a></figcaption></figure><figure class="c" data-s="5" data-i="story"><video src="n04.mp4" poster="n04.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">story · food</span><p>A frozen paratha pack is held up, goes onto a pan, puffs golden, is torn and scooped into a curry, and ends plated on a table.</p><p class="t">Following the product from pack to plate is one chain of events a single photo-to-video clip can do.</p><a href="https://dribbble.com/shots/27589530" target="_blank" rel="noopener">dribbble · </a></figcaption></figure><figure class="c" data-s="5" data-i="morph"><video src="n05.mp4" poster="n05.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">morph · food</span><p>Coffee beans tumble through the frame on yellow, swirl together and land as one wrapped coffee candy with its name, product big and centered.</p><p class="t">Ingredients falling into frame should resolve into the finished product and hold on a clean name frame.</p><a href="https://www.pinterest.com/pin/1000573242205338537/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="explode"><video src="n06.mp4" poster="n06.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">explode · food</span><p>Chocolate chunks fly apart in the air, melt into a glossy swirl, then fuse back into one whole bar on blue.</p><p class="t">Break the product into pieces and re-form it so the end frame is the clean whole product.</p><a href="https://www.pinterest.com/pin/127578601938968152/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="build"><video src="n07.mp4" poster="n07.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">build · food</span><p>A burger&#x27;s layers drop one by one onto a peach ground until the full exploded stack hangs in the air.</p><p class="t">Show the product assembling piece by piece, each layer arriving on its own beat.</p><a href="https://www.pinterest.com/pin/732609064394684604/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="morph"><video src="n08.mp4" poster="n08.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">morph · food</span><p>A peach is sliced into a spiral that swirls into a tunnel of orange and ends on a clean fruit colour field.</p><p class="t">One continuous camera move through the product&#x27;s own shape makes a clever transition.</p><a href="https://www.pinterest.com/pin/4785143351058495/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="drop"><video src="n09.mp4" poster="n09.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">drop · food</span><p>Soft-serve cones fall in from both sides on a blue and orange split, then one swirl lands center with a bold headline.</p><p class="t">Repeat the product falling into place, then lock to one large hero plus a headline.</p><a href="https://www.pinterest.com/pin/5770305767882013/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="build"><video src="n10.mp4" poster="n10.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">build · drinks</span><p>Strawberry, banana and orange pieces float on yellow then come together as one bottle of juice in the centre.</p><p class="t">Show real ingredients becoming the product to explain what is inside without words.</p><a href="https://www.pinterest.com/pin/341640321748432979/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="swap"><video src="n11.mp4" poster="n11.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">swap · food</span><p>Chocolates stay fixed in the centre while the flat-lay around them swaps between desserts and colour grounds in beats, ending on blue cookies.</p><p class="t">Keep the product fixed and swap its surroundings to show range in one clip.</p><a href="https://www.pinterest.com/pin/393642823701519058/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="5" data-i="flavour"><video src="n12.mp4" poster="n12.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>5</b> <span class="t">flavour · drinks</span><p>A text ring spins in, a can lands, and the whole ground and fruit flip colour through three flavours, ending on yellow.</p><p class="t">Change flavour by changing the background colour in a few quick, readable steps.</p><a href="https://www.pinterest.com/pin/1146799492633423596/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="behind"><video src="d73.mp4" poster="d73.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">behind · food</span><p>DELICIOUS BURGER in big outlined letters, the burger in front of the word with smoke drifting behind.</p><a href="https://dribbble.com/shots/27187288-Delicious-Burger-Ad" target="_blank" rel="noopener">dribbble · lubna bano</a></figcaption></figure><figure class="c" data-s="4" data-i="bite"><video src="p104.mp4" poster="p104.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">bite · food</span><p>BITE INTO THE CREAMY CRUNCH: a hand pulls half the sandwich away, then the plate and the name.</p><a href="https://www.pinterest.com/pin/603975000074931900/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="build"><video src="d03.mp4" poster="d03.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">build · food</span><p>Chocolate made in front of you: pieces break, chocolate pours over the logo square, salt falls, a woman takes a bite, the box.</p><a href="https://dribbble.com/shots/27768778-RTR-MELT-72-AI-Chocolate-Commercial-Product-Advertising" target="_blank" rel="noopener">dribbble · rawtorare.artstudio</a></figcaption></figure><figure class="c" data-s="4" data-i="build"><video src="p064.mp4" poster="p064.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">build · bakery</span><p>Eggs, flour and a rolling pin whirl in the air and turn into a cake with raspberries on a stand.</p><a href="https://www.pinterest.com/pin/891431320011923968/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="candles"><video src="p114.mp4" poster="p114.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">candles · holiday</span><p>HAPPY HANUKKAH: the candles of the menorah light one at a time, shamash first. Loops by itself.</p><a href="https://www.pinterest.com/pin/963981495280388456/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="choose"><video src="p043.mp4" poster="p043.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">choose · drinks</span><p>WHICH ONE WILL YOU CHOOSE? Bottles fly in one by one with the flavour written huge and sideways behind each.</p><a href="https://www.pinterest.com/pin/1002402829568669987/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="choose"><video src="p102.mp4" poster="p102.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">choose · drinks</span><p>TIME TO TRY SOMETHING NEW? Cans shuffle like a cup game behind a question mark, one is picked: THE DRINK EVERYONE&#x27;S TALKING ABOUT.</p><a href="https://www.pinterest.com/pin/1000643610972401042/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="cuts"><video src="p096.mp4" poster="p096.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">cuts · sale</span><p>Hard cuts between colours, each frame one more word: OUR / BIGGEST / SALE / EVER, a face, 25% OFF.</p><a href="https://www.pinterest.com/pin/900579256740973092/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="dates"><video src="p094.mp4" poster="p094.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">dates · sale</span><p>A calendar of the month on red: the sale days light up one by one, then the dates in words.</p><a href="https://www.pinterest.com/pin/1064397693203895727/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="drop"><video src="p098.mp4" poster="p098.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">drop · sale</span><p>Sale bags float down on pink parachutes over a city, the 40 on the bag in front.</p><a href="https://www.pinterest.com/pin/1016828422293064886/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="explode"><video src="d74.mp4" poster="d74.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">explode · food</span><p>The burger lifts into floating layers (bun, patty, cheese, bun) and settles back, a bottle beside it.</p><a href="https://dribbble.com/shots/22200035-Burger-Animation-Tutorial" target="_blank" rel="noopener">dribbble · Roman Klco</a></figcaption></figure><figure class="c" data-s="4" data-i="flavour"><video src="p012.mp4" poster="p012.jpg" muted loop playsinline preload="none"></video>
<figcaption><b>4</b> <span class="t">flavour · drinks</span><p>One can per colour: the background and fruit change with each flavour, the can stays in the same place.</p><a href="https://www.pinterest.com/pin/497155246387662650/" target="_blank" rel="noopener">pinterest · </a></figcaption></figure><figure class="c" data-s="4" data-i="flavour"><video src="p049.mp4" poster="p049.jpg" muted loop playsinline preload="none"></video>
