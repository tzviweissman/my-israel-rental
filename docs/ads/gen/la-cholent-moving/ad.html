<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700&family=Playfair+Display:ital,wght@1,600&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#120a05}
#ad{position:relative;width:1080px;height:1920px;overflow:hidden;background:#120a05}
.l{position:absolute;left:0;top:0;width:1080px;height:1920px}
#line{position:absolute;left:0;right:0;top:262px;text-align:center;font:italic 600 82px/100px 'Playfair Display',serif;color:#F3E6C6;white-space:nowrap}
#line span{display:inline-block;margin:0 10px}
#yum{position:absolute;left:0;right:0;top:372px;text-align:center;font:186px/200px Anton,sans-serif;color:#D9B65C;white-space:nowrap;letter-spacing:1px}
#knob{position:absolute;left:460px;top:756px;width:92px;height:92px;border-radius:50%;background:url(front.webp) -460px -756px/1080px 1920px}
#glow{mix-blend-mode:screen;background:radial-gradient(ellipse 330px 260px at 527px 690px,rgba(255,150,60,.55),rgba(255,120,40,0) 70%)}
#logo{position:absolute;left:944px;top:236px;width:100px;height:100px}
#foot{position:absolute;left:48px;top:1500px;font-family:Manrope,sans-serif;color:#E9DCC0}
#foot .n{font-weight:700;font-size:40px;color:#F6EEDC}
#foot .s{font-weight:500;font-size:30px;margin-top:14px}
#foot .u{font-weight:700;font-size:30px;margin-top:14px;color:#D9B65C}
#qr{position:absolute;left:868px;top:1508px;width:164px;height:164px;background:#fff;border-radius:14px;padding:8px;box-sizing:border-box}
#qr img{width:100%;height:100%}
</style></head><body>
<div id="ad">
  <img id="ground" class="l" src="ground.webp">
  <div id="line"><span id="w0">Pour.</span><span id="w1">Water.</span><span id="w2">Low.</span></div>
  <img id="menorah" class="l" style="display:none">
  <div id="yum"></div>
  <canvas id="steam" class="l" width="1080" height="1920"></canvas>
  <canvas id="flames" class="l" width="1080" height="1920" style="display:none"></canvas>
  <img id="pot" class="l" src="front.webp" style="clip-path:inset(0 0 1015px 0)">
  <div id="knob"></div>
  <img id="tubs" class="l" src="front.webp" style="clip-path:inset(905px 0 0 0)">
  <div id="glow" class="l"></div>
  <img id="logo" src="logo.png">
  <div id="foot"><div class="n">L.A. Cholent by Rabbi Samuels</div>
    <div class="s">Raw cholent kit: add water, about 20 hours on low</div>
    <div class="s">Kosher, Rabbi Weiner · Kits from ₪100</div>
    <div class="u">myisraelrental.com/p/l-a-cholent-by-rabbi-samuels</div></div>
  <div id="qr"><img src="qr.png"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
// ?v=chanukah: the same ad on the picture with a menorah (docs/ads/gen/la-cholent-chanukah-moving), lit in code.
const CHANUKAH = new URLSearchParams(location.search).get('v') === 'chanukah';
if (CHANUKAH) {
  const d = '../la-cholent-chanukah-moving/';
  $('ground').src = d + 'ground.webp';
  for (const id of ['pot', 'tubs']) $(id).src = d + 'front.webp';
  $('knob').style.backgroundImage = `url(${d}front.webp)`;
  $('menorah').src = d + 'menorah.webp';
  $('menorah').style.display = $('flames').style.display = '';
  $('yum').style.textShadow = '0 4px 22px rgba(20,8,0,.75)';  // keeps the last Ms apart from the white candles behind them
}
// The candle tops measured on menorah.webp, left to right; the shamash is the raised one in the middle.
const SHAMASH = { x: 900, y: 362 };
const CANDLES = [776, 806, 834, 864, 930, 958, 986, 1013].map((x) => ({ x, y: 406 }));
// Shamash first, then the eight from the left, one at a time; frozen from 5.6 s so the ad holds still.
const LIT = [{ ...SHAMASH, at: 0.15 }, ...CANDLES.map((c, i) => ({ ...c, at: 0.5 + i * 0.33 }))];
function flames(t) {
  const c = $('flames').getContext('2d'); c.clearRect(0, 0, 1080, 1920);
  const tt = Math.min(t, 5.6);
  LIT.forEach((f, i) => {
    if (t < f.at) return;
    const grow = outBack(cl((t - f.at) / 0.18));
    const fl = 1 + 0.08 * Math.sin(tt * 19 + i * 2.1) + 0.05 * Math.sin(tt * 31 + i);
    const h = 30 * grow * fl, w = 6.5 * grow, x = f.x + Math.sin(tt * 13 + i) * 1.2, y = f.y + 2;
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(x, y - h * 0.45, 0, x, y - h * 0.45, 60 * grow);
    g.addColorStop(0, `rgba(255,170,80,${0.32 * grow})`); g.addColorStop(1, 'rgba(255,140,50,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y - h * 0.45, 60 * grow, 0, 7); c.fill();
    c.globalCompositeOperation = 'source-over';
    const fg = c.createLinearGradient(x, y, x, y - h);
    fg.addColorStop(0, 'rgba(255,170,60,0.95)'); fg.addColorStop(0.35, 'rgba(255,236,170,1)'); fg.addColorStop(1, 'rgba(255,200,110,0)');
    c.fillStyle = fg; c.beginPath(); c.moveTo(x, y - h);
    c.bezierCurveTo(x + w * 1.3, y - h * 0.45, x + w, y, x, y); c.bezierCurveTo(x - w, y, x - w * 1.3, y - h * 0.45, x, y - h); c.fill();
  });
}
const cl = (x) => Math.max(0, Math.min(1, x));
const outBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const BEATS = [0, 0.75, 1.5];          // Pour., Water., Low. each arrives big, then settles into the line
const SETTLE = 0.42;
let slots = null;
function measure() {
  slots = [0, 1, 2].map((i) => { const r = $('w' + i).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; });
}
// steam puffs, fixed seed so every render of time t is the same picture
const puffs = []; let s = 7;
const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
for (let i = 0; i < 40; i++) puffs.push({ t0: 1.75 + i * 0.085, dx: rnd() * 30 - 15, ph: rnd() * 6.28, r: 26 + rnd() * 20 });
function steam(t) {
  const c = $('steam').getContext('2d'); c.clearRect(0, 0, 1080, 1920);
  for (const p of puffs) {
    const a = (t - p.t0) / 1.7; if (a < 0 || a > 1 || p.t0 > 4.2) continue;
    const x = 604 + p.dx + Math.sin(p.ph + a * 4) * 26 + a * 40, y = 500 - a * 250, r = p.r * (1 + a * 1.6);
    const al = 0.16 * Math.sin(Math.PI * a);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(245,238,228,${al})`); g.addColorStop(1, 'rgba(245,238,228,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
}
window.render = (t) => {
  if (!slots) measure();
  // the three steps: big in the middle of the dark wall, then into their place on the line
  BEATS.forEach((b, i) => {
    const el = $('w' + i), sl = slots[i];
    if (t < b) { el.style.opacity = 0; return; }
    el.style.opacity = 1;
    const pop = outBack(cl((t - b) / 0.22));
    const k = outCubic(cl((t - b - 0.33) / SETTLE));
    const big = 2.1 * (0.75 + 0.25 * pop);
    const sc = big + (1 - big) * k;
    const dx = (540 - sl.x) * (1 - k), dy = (410 - sl.y) * (1 - k);
    el.style.transform = `translate(${dx}px,${dy}px) scale(${sc})`;
  });
  // Pour.: the kit tubs land on the table (scaled down onto their own place, never smaller than it)
  const land = cl((t - 0.12) / 0.4), squash = t > 0.52 && t < 0.72 ? Math.sin((t - 0.52) / 0.2 * Math.PI) * 0.018 : 0;
  $('tubs').style.transformOrigin = '540px 1250px';
  $('tubs').style.opacity = t < 0.12 ? 0 : 1;
  $('tubs').style.transform = `scale(${1 + 0.22 * (1 - outCubic(land)) + squash})`;
  // Water.: the pot takes it, one small bump
  const wb = t > 0.8 && t < 1.15 ? Math.sin((t - 0.8) / 0.35 * Math.PI) * 0.025 : 0;
  for (const id of ['pot', 'knob']) { $(id).style.transformOrigin = id === 'pot' ? '527px 900px' : '46px 46px'; }
  $('pot').style.transform = `scale(${1 + wb})`;
  // Low.: the knob turns to low, the pot warms and starts to steam
  const kn = outBack(cl((t - 1.6) / 0.4));
  $('knob').style.transform = `translate(0,${(802 - 900) * -wb}px) scale(${1 + wb}) rotate(${-110 * (1 - kn)}deg)`;
  $('glow').style.opacity = 0.5 * cl((t - 1.7) / 0.4) * (1 - cl((t - 3.4) / 1.8));
  steam(t);
  if (CHANUKAH) flames(t);
  // YUMMMMM.: YUM. lands, then one more M at a time
  const y0 = 2.35;
  const ms = t < y0 ? -1 : Math.min(4, Math.floor((t - y0 - 0.22) / 0.13) + 1);
  const yum = $('yum');
  if (ms < 0) { yum.style.opacity = 0; } else {
    yum.style.opacity = 1;
    yum.textContent = 'YUM' + 'M'.repeat(Math.max(0, ms)) + '.';
    const p = outBack(cl((t - y0) / 0.24));
    yum.style.transform = `scale(${1.5 - 0.5 * p})`;
  }
};
</script></body></html>
