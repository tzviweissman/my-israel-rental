<!doctype html>
<html><head><meta charset="utf-8">
<!-- Chicken Munch Chanukah moving ad, in 3D (docs/ads/blueprints/chicken-munch-chanukah-moving.md). Tzvi, 22 Nov 2026:
     "make there more details ... make the munch box actually look behind him ... they are 3d and full of detail".
     Five 3D shots (gen3d.py) each made to move (clip3d.py), played frame by frame from c1/ to c5/ (made from out/c*.mp4
     with ffmpeg fps=30 scale=1080:1920). The drawn first version is ad-drawn.html.
     Words wait (M6): one line per beat, then the headline, logo, foot and QR from 6.4 s; they eat to the end (M8).
     Record: RECORD_LEN=10 node scripts/record-moving-ad.mjs docs/ads/gen/chicken-munch-chanukah-moving chicken-munch-chanukah-moving -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#111}
#ad{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1a0f08;font-family:Manrope,sans-serif;color:#fff}
.l{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#topshade{background:linear-gradient(#0d0703f0 0,#0d0703c8 640px,#0d070300 900px)}
#footshade{background:linear-gradient(#0d070300 1380px,#0d0703d8 1560px,#0d0703f2 1920px)}
#line{position:absolute;left:60px;right:60px;top:300px;font:104px/1 Anton,sans-serif;text-transform:uppercase;color:#FFF3D6;text-shadow:0 6px 28px #000c}
.h{position:absolute;left:60px;font:116px/1 Anton,sans-serif;text-transform:uppercase;color:#FFF3D6;text-shadow:0 6px 28px #000a}
#h1{top:400px}#h2{top:522px}#h2 b{color:#FAA519;font-weight:400}
#small{position:absolute;left:62px;top:658px;font-weight:700;font-size:40px;color:#FFF3D6;text-shadow:0 3px 14px #000c}
#logo{position:absolute;left:375px;top:236px;width:330px;height:auto;background:#0E0D0C;border-radius:22px;padding:14px 22px;box-sizing:border-box}
#foot{position:absolute;left:48px;top:1540px;width:780px;color:#fff}
#foot .n{font-weight:700;font-size:40px}
#foot .s{font-weight:500;font-size:30px;margin-top:14px;opacity:.92}
#foot .u{font-weight:700;font-size:30px;margin-top:14px}
#qr{position:absolute;left:868px;top:1520px;width:170px;height:170px;background:#fff;border-radius:14px;padding:8px;box-sizing:border-box}
#qr img{width:100%;height:100%}
</style></head><body>
<div id="ad">
  <img id="v" class="l" alt="">
  <!-- from 7.3 s the picture above and below the living box holds one frame, so the words, logo, foot and QR stand
       on a still ground while the three of them keep eating in the middle (M8) -->
  <img id="hold" class="l" alt="" style="clip-path:polygon(0 0,100% 0,100% 712px,0 712px,0 1518px,100% 1518px,100% 100%,0 100%);opacity:0">
  <div id="topshade" class="l"></div>
  <div id="footshade" class="l"></div>
  <div id="line"></div>
  <div id="h1" class="h">Not all decisions</div><div id="h2" class="h">need to be <b>hard.</b></div>
  <div id="small">Get Chicken Munch for your next Chanukah party.</div>
</div>
<script src="../_kit/kit.js"></script>
<script>
window.AD = {"name":"Chicken Munch","lines":["Kosher, hechsher of Rav Akiva Dershowitz · Jerusalem"],"link":"myisraelrental.com/p/chicken-munch","logo":"logo-mark.png"};
K.foot();
const $ = (id) => document.getElementById(id);
// the cut: each shot's start in the ad, its clip, where in the clip it starts and how fast it plays
const SHOTS = [
  { at: 0.0, dir: 'c1', from: 0.4, speed: 1.25, line: 'Looking for the oil...' },
  { at: 1.7, dir: 'c2', from: 0.9, speed: 1.5, line: 'Found it!' },
  { at: 3.3, dir: 'c3', from: 0.4, speed: 1.6, line: 'Hard decision.' },
  { at: 5.1, dir: 'c4', from: 0.0, speed: 1.4, line: '' },
  { at: 6.2, dir: 'c5', from: 0.0, speed: 1.0, line: '' },
];
const show = async (dir, sec) => {
  const n = Math.max(1, Math.min(198, Math.floor(sec * 30) + 1));
  const src = `${dir}/${String(n).padStart(4, '0')}.jpg`;
  const v = $('v');
  if (!v.src.endsWith(src)) { v.src = src; await v.decode().catch(() => {}); }
};
const slam = (el, t, at) => { const k = K.at(t, at, 0.22); el.style.opacity = k > 0 ? 1 : 0; el.style.transform = `scale(${1.35 - 0.35 * K.outCubic(k)})`; el.style.transformOrigin = 'left center'; };
// the end keeps living: they eat in the middle of the frame while the words, logo, foot and QR hold (M8). The clip
// moves the whole picture, so the living box is the picture between the headline and the foot.
window.LIVING = [0, 712, 1080, 1518];
window.render = async (t) => {
  let i = 0; while (i + 1 < SHOTS.length && t >= SHOTS[i + 1].at) i++;
  const s = SHOTS[i];
  await show(s.dir, s.from + (t - s.at) * s.speed);
  const end = i === SHOTS.length - 1;
  const HOLD = 7.3, hold = $('hold');
  if (t >= HOLD) {
    const n = Math.floor((s.from + (HOLD - s.at) * s.speed) * 30) + 1;
    const src = `${s.dir}/${String(n).padStart(4, '0')}.jpg`;
    if (!hold.src.endsWith(src)) { hold.src = src; await hold.decode().catch(() => {}); }
  }
  hold.style.opacity = t >= HOLD ? 1 : 0;
  $('topshade').style.opacity = end ? K.at(t, s.at, 0.4) : 0.35;
  $('footshade').style.opacity = end ? K.at(t, 6.4, 0.4) : 0;
  const ln = $('line');
  ln.textContent = s.line;
  if (s.line) slam(ln, t, s.at + 0.1); else ln.style.opacity = 0;
  slam($('h1'), t, 6.6); slam($('h2'), t, 6.9);
  $('small').style.opacity = K.at(t, 7.2, 0.3);
  $('logo').style.opacity = K.at(t, 6.4, 0.4);
  K.footIn(t, 6.4);
};
</script></body></html>
