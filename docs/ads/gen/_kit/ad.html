<!doctype html>
<html><head><meta charset="utf-8">
<!-- {{NAME}} moving ad (docs/ads/blueprints/{{AD}}.md), started from the kit (docs/ads/gen/_kit, A10.9).
     Add the idea in render(t); the foot, QR and logo come from the kit. Plan the last frame first (A10.7).
     Record: node scripts/record-moving-ad.mjs docs/ads/gen/{{AD}} {{AD}}
     Check:  backend/.venv/Scripts/python scripts/check-moving-ad.py docs/ads/{{AD}}.mp4 -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#111}
#ad{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4EFE6;font-family:Manrope,sans-serif;color:#1d1a17}
.l{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#clip,#scrim{display:none}
#scrim{background:linear-gradient(#0000 0,#0000 1250px,#000c 1560px,#000e 1920px)}
.clip #clip,.clip #scrim{display:block}.clip #foot{color:#fff}
#word{position:absolute;left:60px;right:60px;top:420px;text-align:center;font:220px/1 Anton,sans-serif}
#logo{position:absolute;left:900px;top:236px;width:130px;height:130px;object-fit:contain}
#foot{position:absolute;left:48px;top:1520px;width:780px}
#foot .n{font-weight:700;font-size:40px}
#foot .s{font-weight:500;font-size:30px;margin-top:14px;opacity:.85}
#foot .u{font-weight:700;font-size:30px;margin-top:14px}
#qr{position:absolute;left:868px;top:1508px;width:164px;height:164px;background:#fff;border-radius:14px;padding:8px;box-sizing:border-box}
#qr img{width:100%;height:100%}
</style></head><body>
<div id="ad">
  <img id="clip" class="l" alt="">
  <div id="scrim" class="l"></div>
  <div id="word">{{NAME}}</div>
</div>
<script src="../_kit/kit.js"></script>
<script>
window.AD = {{CONFIG}};
K.foot();
const $ = (id) => document.getElementById(id);
// A generated clip (A10.10): node scripts/new-moving-ad.mjs --clip {{AD}} <clip.mp4> sets CLIP_FRAMES and CLIP_FPS,
// so whatever its length the clip plays in 6.0 s and the 8 s ad holds still for 2 (A10.3).
const CLIP_FRAMES = 0;
const CLIP_FPS = 30;
if (CLIP_FRAMES) $('ad').classList.add('clip');  // the clip shows, and a shade keeps the foot readable
window.render = async (t) => {
  if (CLIP_FRAMES) await K.clip($('clip'), t, { frames: CLIP_FRAMES, fps: CLIP_FPS });
  const k = K.outBack(K.at(t, 0.1, 0.5));
  $('word').style.transform = `scale(${0.6 + 0.4 * k})`;
  K.footIn(t);  // name, link and QR wait for the last beat (M6)
};
</script></body></html>
