<!doctype html>
<html><head><meta charset="utf-8">
<!-- American Crust Chanukah moving ad, in 3D (docs/ads/blueprints/american-crust-chanukah-moving.md). Tzvi, 23 Nov 2026:
     "each scene isnt connected ... just use the ad we made for chicken munch and put his bagels instead and maybe show a
     thought bubble when hes making the decision". The story flows as one (M15): he searches the jars, and then finds
     the glowing oil, and then turns and sees their bagels on the table and weighs it (thought bubble), and then tosses
     the oil over his shoulder, and then walks out holding their pack with the bagels, and then the three eat.
     Shots 1, 2 and the toss are the Chicken Munch film's (../chicken-munch-chanukah-moving/c1, c2, c4b); d3 and d6
     are remade with their bagels (gen3d.py t3, t6; clip3d.py d3, d6) with their real label laid on; c5 is the three
     eating with the pack. The jar-hunt version is ad-jars.html.
     Record: RECORD_LEN=10 node scripts/record-moving-ad.mjs docs/ads/gen/american-crust-chanukah-moving american-crust-chanukah-moving -->
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Barlow:wght@500;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#111}
#ad{position:relative;width:1080px;height:1920px;overflow:hidden;background:#141414;font-family:Barlow,sans-serif;color:#fff}
.l{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#topshade{background:linear-gradient(#0a0d18e6 0,#0a0d18b8 720px,#0a0d1800 900px)}
#footshade{background:linear-gradient(#14141400 1380px,#141414d8 1560px,#141414f2 1920px)}
/* the thought bubble while he decides: the oil jug, then their bagels (M15: a choice is shown) */
#bubble{position:absolute;left:470px;top:250px;width:420px;height:330px;opacity:0;transform-origin:20% 100%}
#bubble .cloud{position:absolute;inset:0;background:#fff;border-radius:50%;box-shadow:0 10px 40px #0007}
#bubble .p{position:absolute;left:70px;top:25px;width:280px;height:280px;border-radius:50%}
#bubble .dot{position:absolute;background:#fff;border-radius:50%;box-shadow:0 6px 20px #0006}
.h{position:absolute;left:0;right:0;text-align:center;font:156px/0.9 'League Gothic',Impact,sans-serif;text-transform:uppercase;color:#FEF7E5;text-shadow:0 6px 30px #000b}
#h1{top:478px}#h2{top:618px;color:#FDB225}
#small{position:absolute;left:40px;right:40px;top:700px;text-align:center;font-weight:700;font-size:40px;color:#FEF7E5;text-shadow:0 3px 14px #000c}
#logo{position:absolute;left:420px;top:226px;width:240px;height:auto;filter:drop-shadow(0 8px 24px #0008)}
#foot{position:absolute;left:48px;top:1512px;width:790px;color:#fff}
#foot .n{font-weight:700;font-size:36px;line-height:1.15}
#foot .s{font-weight:500;font-size:28px;margin-top:10px;opacity:.92}
#foot .u{font-weight:700;font-size:30px;margin-top:14px}
#qr{position:absolute;left:868px;top:1520px;width:170px;height:170px;background:#fff;border-radius:14px;padding:8px;box-sizing:border-box}
#qr img{width:100%;height:100%}
</style></head><body>
<div id="ad">
  <img id="v" class="l" alt="">
  <img id="hold" class="l" alt="" style="clip-path:polygon(0 0,100% 0,100% 790px,0 790px,0 1518px,100% 1518px,100% 100%,0 100%);opacity:0">
  <div id="topshade" class="l"></div>
  <div id="footshade" class="l"></div>
  <div id="bubble">
    <div class="dot" style="left:-60px;top:330px;width:44px;height:44px"></div>
    <div class="dot" style="left:-10px;top:290px;width:66px;height:66px"></div>
    <div class="cloud"></div>
    <img id="bjug" class="p" src="think-jug.png" alt=""><img id="bbag" class="p" src="think-bagels.png" alt="">
  </div>
  <div id="h1" class="h">Not all decisions</div><div id="h2" class="h">need to be hard.</div>

</div>
<script src="../_kit/kit.js"></script>
<script>
window.AD = {"name":"Order American Crust bagels on myisraelrental.com","lines":["Pareve, hechsher of Rabbi Akiva Dershowitz"],"link":"myisraelrental.com/p/american-crust","logo":"logo-round.png"};
K.foot();
const $ = (id) => document.getElementById(id);
const CM = '../chicken-munch-chanukah-moving/';
// the Chicken Munch film's cut, with their bagels in the shots where the product is
const SHOTS = [
  { at: 0.0, dir: CM + 'c1', from: 0.4, speed: 1.4 },    // he searches the jars
  { at: 1.4, dir: CM + 'c2', from: 0.9, speed: 1.6 },    // and finds the glowing oil
  { at: 2.6, dir: 'd3', from: 0.3, speed: 1.2 },         // and turns: their bagels on the table; he weighs it
  { at: 4.2, dir: CM + 'c4b', from: 0.3, speed: 1.2 },   // and tosses the oil over his shoulder
  { at: 5.3, dir: 'd6', from: 0.0, speed: 1.4 },         // and walks out holding their pack with the bagels
  { at: 6.6, dir: 'c5', from: 0.0, speed: 1.0 },         // and the three eat
];
const show = async (dir, sec) => {
  const n = Math.max(1, Math.min(198, Math.floor(sec * 30) + 1));
  const src = `${dir}/${String(n).padStart(4, '0')}.jpg`;
  const v = $('v');
  if (!v.src.endsWith(src)) { v.src = src; await v.decode().catch(() => {}); }
};
const slam = (el, t, at) => { const k = K.at(t, at, 0.22); el.style.opacity = k > 0 ? 1 : 0; el.style.transform = `scale(${1.3 - 0.3 * K.outCubic(k)})`; };
window.LIVING = [0, 782, 1080, 1518];   // they eat below the words while the sky, words, logo, foot and QR hold (M8)
window.render = async (t) => {
  let i = 0; while (i + 1 < SHOTS.length && t >= SHOTS[i + 1].at) i++;
  const s = SHOTS[i];
  await show(s.dir, s.from + (t - s.at) * s.speed);
  const end = i === SHOTS.length - 1;
  const HOLD = 7.8, hold = $('hold');
  if (t >= HOLD) {
    const n = Math.floor((s.from + (HOLD - s.at) * s.speed) * 30) + 1;
    const src = `${s.dir}/${String(n).padStart(4, '0')}.jpg`;
    if (!hold.src.endsWith(src)) { hold.src = src; await hold.decode().catch(() => {}); }
  }
  hold.style.opacity = t >= HOLD ? 1 : 0;
  // the bubble pops up while he thinks: the jug, then the bagels, then the bagels win (it pops at 4.0)
  const b = $('bubble'), inB = K.outBack(K.at(t, 2.85, 0.3)), outB = K.at(t, 3.95, 0.2);
  b.style.opacity = t >= 2.85 && t < 4.2 ? Math.min(1, inB * 1.5) * (1 - outB) : 0;
  b.style.transform = `scale(${(0.4 + 0.6 * inB) * (1 + 0.25 * outB)})`;
  const bag = t >= 3.4;                                   // jug first, then the bagels
  $('bjug').style.opacity = bag ? 0 : 1; $('bbag').style.opacity = bag ? 1 : 0;
  $('topshade').style.opacity = end ? K.at(t, s.at, 0.4) : 0;
  $('footshade').style.opacity = end ? K.at(t, 6.6, 0.4) : 0;
  slam($('h1'), t, 6.9); slam($('h2'), t, 7.2);

  $('logo').style.opacity = K.at(t, 6.45, 0.4);
  K.footIn(t, 6.45);   // the QR is whole by 6.85 s and still for over 3 s (A10.3)
};
</script></body></html>
