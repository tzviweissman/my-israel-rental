<!doctype html>
<html><head><meta charset="utf-8">
<!-- American Crust Chanukah moving ad, in 3D (docs/ads/blueprints/american-crust-chanukah-moving.md). Tzvi, 22 Nov 2026:
     the eighth jar, "Stop searching. Start baking.", "just make it an american crust film". The Maccabee tips seven empty
     jars, the eighth glows, inside is their bagel dough pack, the bagels come out of the oven, the three eat.
     Five 3D shots (gen3d.py) made to move (clip3d.py), played frame by frame from c1/ to c5/ (ffmpeg fps=30
     scale=1080:1920); their real label is laid on the pack in c3/ and c5/ (A28.2).
     No words in the story; the headline, logo, foot and QR from 6.4 s; they eat to the end (M8).
     Record: RECORD_LEN=10 node scripts/record-moving-ad.mjs docs/ads/gen/american-crust-chanukah-moving american-crust-chanukah-moving -->
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Barlow:wght@500;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#111}
#ad{position:relative;width:1080px;height:1920px;overflow:hidden;background:#141414;font-family:Barlow,sans-serif;color:#fff}
.l{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#topshade{background:linear-gradient(#0a0d18e0 0,#0a0d18b0 700px,#0a0d1800 900px)}
#footshade{background:linear-gradient(#14141400 1380px,#141414d8 1560px,#141414f2 1920px)}
/* BRAND.md: tall condensed capitals, their mustard on the second line */
.h{position:absolute;left:0;right:0;text-align:center;font:200px/0.9 'League Gothic',Impact,sans-serif;text-transform:uppercase;color:#FEF7E5;text-shadow:0 6px 30px #000b}
#h1{top:480px}#h2{top:650px;color:#FDB225}
#logo{position:absolute;left:420px;top:228px;width:240px;height:auto;filter:drop-shadow(0 8px 24px #0008)}
#foot{position:absolute;left:48px;top:1540px;width:780px;color:#fff}
#foot .n{font-weight:700;font-size:40px}
#foot .s{font-weight:500;font-size:30px;margin-top:14px;opacity:.92}
#foot .u{font-weight:700;font-size:30px;margin-top:14px}
#qr{position:absolute;left:868px;top:1520px;width:170px;height:170px;background:#fff;border-radius:14px;padding:8px;box-sizing:border-box}
#qr img{width:100%;height:100%}
</style></head><body>
<div id="ad">
  <img id="v" class="l" alt="">
  <img id="hold" class="l" alt="" style="clip-path:polygon(0 0,100% 0,100% 760px,0 760px,0 1518px,100% 1518px,100% 100%,0 100%);opacity:0">
  <div id="topshade" class="l"></div>
  <div id="footshade" class="l"></div>
  <div id="h1" class="h">Stop searching.</div><div id="h2" class="h">Start baking.</div>
</div>
<script src="../_kit/kit.js"></script>
<script>
window.AD = {"name":"American Crust","lines":["American-style bagel dough, makes 6 · Pareve, hechsher of Rabbi Akiva Dershowitz"],"link":"myisraelrental.com/p/american-crust","logo":"logo-round.png"};
K.foot();
const $ = (id) => document.getElementById(id);
// the cut: each shot's start in the ad, its clip, where in the clip it starts and how fast it plays
const SHOTS = [
  { at: 0.0, dir: 'c1', from: 0.3, speed: 2.2 },   // seven jars, all empty, rolling away
  { at: 1.6, dir: 'c2', from: 0.5, speed: 2.0 },   // the eighth glows; gold light on his face
  { at: 3.2, dir: 'c3', from: 0.5, speed: 1.0 },   // their pack, real label, his friends gasp
  { at: 4.8, dir: 'c4', from: 0.5, speed: 1.6 },   // six everything bagels out of the oven
  { at: 6.2, dir: 'c5', from: 0.0, speed: 1.0 },   // the three eat; the words above them
];
const show = async (dir, sec) => {
  const n = Math.max(1, Math.min(198, Math.floor(sec * 30) + 1));
  const src = `${dir}/${String(n).padStart(4, '0')}.jpg`;
  const v = $('v');
  if (!v.src.endsWith(src)) { v.src = src; await v.decode().catch(() => {}); }
};
const slam = (el, t, at) => { const k = K.at(t, at, 0.22); el.style.opacity = k > 0 ? 1 : 0; el.style.transform = `scale(${1.3 - 0.3 * K.outCubic(k)})`; };
// the end keeps living: they eat below the words while the sky, words, logo, foot and QR hold (M8)
window.LIVING = [0, 752, 1080, 1518];
window.render = async (t) => {
  let i = 0; while (i + 1 < SHOTS.length && t >= SHOTS[i + 1].at) i++;
  const s = SHOTS[i];
  await show(s.dir, s.from + (t - s.at) * s.speed);
  const end = i === SHOTS.length - 1;
  const HOLD = 7.7, hold = $('hold');
  if (t >= HOLD) {
    const n = Math.floor((s.from + (HOLD - s.at) * s.speed) * 30) + 1;
    const src = `${s.dir}/${String(n).padStart(4, '0')}.jpg`;
    if (!hold.src.endsWith(src)) { hold.src = src; await hold.decode().catch(() => {}); }
  }
  hold.style.opacity = t >= HOLD ? 1 : 0;
  $('topshade').style.opacity = end ? K.at(t, s.at, 0.4) : 0;
  $('footshade').style.opacity = end ? K.at(t, 6.4, 0.4) : 0;
  slam($('h1'), t, 6.7); slam($('h2'), t, 7.0);
  $('logo').style.opacity = K.at(t, 6.4, 0.4);
  K.footIn(t, 6.4);   // the QR is whole by 6.8 s and still for over 3 s (A10.3)
};
</script></body></html>
