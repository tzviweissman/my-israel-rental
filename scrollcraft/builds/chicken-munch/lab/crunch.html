<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken Munch, CRUNCH opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Idea 7: giant CRUNCH filled with his real cornflake crust breaks into flat
     shards that fly past the viewer, and his poppers photo is underneath.
     Every shard is a rigid piece of his photo; nothing generated. */
  :root { --black: #0E0D0C; --ink: #F6F1E7; --muted: #B9B0A2; --red: #EF2B2B; --gold: #FAA519; --gold-dk: #B9740A;
    --out: cubic-bezier(.22,1,.36,1); --font-head: 'Anton', Impact, sans-serif; --font-body: 'Archivo', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--black); color: var(--ink); font: 400 1.0625rem/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
  .run { height: 420svh; position: relative; }
  .stage { position: sticky; top: 0; height: 100svh; overflow: hidden; perspective: 900px; }
  .photo { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgb(14 13 12 / .88) 0%, rgb(14 13 12 / .55) 38%, rgb(14 13 12 / 0) 70%); }
  .word { position: absolute; left: 50%; top: 50%; translate: -50% -50%; transform-style: preserve-3d;
    font: 400 min(31vw, 56svh)/.86 var(--font-head); letter-spacing: -.005em; white-space: nowrap; }
  .word .size { visibility: hidden; display: block; padding: .04em .02em; }
  .shard { position: absolute; inset: 0; will-change: transform, opacity; }
  .shard span { display: block; padding: .04em .02em; color: transparent;
    background: url(crust.webp) center / cover; -webkit-background-clip: text; background-clip: text;
    filter: brightness(var(--b, 1.08)) saturate(1.1); }
  .tag { position: absolute; left: 0; right: 0; bottom: 9svh; text-align: center; font: 500 .82rem/1 var(--font-body);
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .copy { position: absolute; left: max(16px, 6vw); top: 50%; translate: 0 -50%; width: min(560px, 88vw); opacity: 0; }
  .copy .label { color: var(--gold); font: 700 .8rem/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase; margin: 0 0 1rem; }
  .copy h1 { font: 400 clamp(2.6rem, 6vw, 5.4rem)/.95 var(--font-head); text-transform: uppercase; margin: 0 0 1rem; }
  .copy h1 .red { color: var(--red); }
  .copy p.lede { color: var(--muted); margin: 0 0 1.6rem; max-width: 30em; }
  .btn { display: inline-flex; align-items: center; gap: .6rem; min-height: 54px; padding: 0 1.7rem; border-radius: 999px;
    background: var(--gold); color: var(--black); font: 700 1.05rem/1 var(--font-body); text-decoration: none; box-shadow: 0 4px 0 var(--gold-dk);
    transition: transform 160ms var(--out), box-shadow 160ms var(--out); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--gold-dk); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dk); }
  .proof { display: inline-block; margin-left: 1rem; color: var(--muted); font-size: .92rem; vertical-align: middle; }
  .proof b { color: var(--ink); }
  .after { padding: 18svh 6vw; color: var(--muted); text-align: center; }
  @media (max-width: 760px) {
    .photo::after { background: linear-gradient(0deg, rgb(14 13 12 / .92) 0%, rgb(14 13 12 / .6) 45%, rgb(14 13 12 / .1) 75%); }
    .copy { top: auto; bottom: 7svh; translate: none; }
    .proof { display: block; margin: .9rem 0 0; }
  }
  @media (prefers-reduced-motion: reduce) { .word, .tag { display: none; } .photo, .copy { opacity: 1 !important; } }
</style>
</head>
<body>
<section class="run" id="run">
  <div class="stage">
    <div class="photo" id="photo"><img src="../assets/poppers.webp" alt="A kraft bowl of Original Hot Poppers, chicken bites in a glossy sweet and spicy glaze" width="1600" height="1323"></div>
    <div class="word" id="word" aria-hidden="true"><span class="size">CRUNCH</span></div>
    <p class="tag" id="tag">Chicken Munch · scroll</p>
    <div class="copy" id="copy">
      <p class="label">Kosher American fried chicken · Jerusalem</p>
      <h1>The taste of America, <span class="red">now in Israel</span></h1>
      <p class="lede">Premium fried chicken, made with the finest ingredients and crafted with care.</p>
      <a class="btn" href="#">Order now <span aria-hidden="true">→</span></a>
      <span class="proof">Munch boxes from <b>$69</b> · Pans from <b>₪275</b></span>
    </div>
  </div>
</section>
<div class="after">The rest of the page continues here.</div>
<script>
(() => {
  const word = document.getElementById('word'), photo = document.getElementById('photo'),
        copy = document.getElementById('copy'), tag = document.getElementById('tag'), run = document.getElementById('run');
  // Break the word into jittered triangles (a fixed seed, so every visit breaks the same way).
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const COLS = 9, ROWS = 3, pts = [];
  for (let r = 0; r <= ROWS; r++) { pts.push([]); for (let c = 0; c <= COLS; c++) {
    const edgeX = c === 0 || c === COLS, edgeY = r === 0 || r === ROWS;
    pts[r].push([c / COLS * 100 + (edgeX ? 0 : (rnd() - .5) * 8), r / ROWS * 100 + (edgeY ? 0 : (rnd() - .5) * 22)]);
  } }
  const shards = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const a = pts[r][c], b = pts[r][c + 1], d = pts[r + 1][c], e = pts[r + 1][c + 1];
    for (const tri of (rnd() > .5 ? [[a, b, e], [a, e, d]] : [[a, b, d], [b, e, d]])) {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      const el = document.createElement('div'); el.className = 'shard';
      el.style.clipPath = `polygon(${tri.map(p => `${p[0]}% ${p[1]}%`).join(',')})`;
      el.style.transformOrigin = `${cx}% ${cy}%`;
      el.innerHTML = '<span>CRUNCH</span>';
      word.appendChild(el);
      const dx = cx - 50, dy = cy - 50, len = Math.hypot(dx, dy * 2.4) || 1;
      shards.push({ el, ux: dx / len, uy: dy * 2.4 / len, z: 180 + rnd() * 460, spin: (rnd() - .5) * 140,
        tilt: (rnd() - .5) * 120, delay: rnd() * .18 + (Math.abs(dx) / 50) * .08 });
    }
  }
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = t => 1 - Math.pow(1 - t, 3), inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame() {
    const rect = run.getBoundingClientRect(), span = run.offsetHeight - innerHeight;
    const p = clamp(-rect.top / span);
    // 0 to .14: the word holds and slowly grows. .14 to .62: it breaks and flies past. .5 to 1: his photo and the words.
    const hold = clamp(p / .08), brk = clamp((p - .08) / .6);
    word.style.transform = `scale(${1 + hold * .06})`;
    for (const sh of shards) {
      const t0 = clamp((brk - sh.delay) / (1 - .26)), t = 1 - (1 - t0) * (1 - t0);
      const dist = t * Math.min(innerWidth, 1200) * .75;
      sh.el.style.transform = `translate3d(${sh.ux * dist}px, ${sh.uy * dist * .6 + t * t * 90}px, ${t * sh.z}px)` +
        ` rotateZ(${t * sh.spin}deg) rotateX(${t * sh.tilt}deg) rotateY(${t * sh.tilt * .6}deg)`;
      sh.el.style.opacity = 1 - clamp((t - .55) / .45);
      sh.el.style.setProperty('--b', (1.08 + Math.abs(Math.sin(t * 3 + sh.spin)) * .45 * t).toFixed(2));
    }
    const ph = inOut(clamp((p - .14) / .45));
    photo.style.opacity = ph;
    photo.style.transform = `scale(${1.28 - .28 * ph})`;
    tag.style.opacity = 1 - clamp(p / .1);
    const cp = ease(clamp((p - .66) / .2));
    copy.style.opacity = cp;
    copy.style.marginTop = `${(1 - cp) * 24}px`;
  }
  if (!reduce) { let q = false; addEventListener('scroll', () => { if (!q) { q = true; requestAnimationFrame(() => { q = false; frame(); }); } }, { passive: true });
    addEventListener('resize', frame); frame(); }
})();
</script>
</body>
</html>
