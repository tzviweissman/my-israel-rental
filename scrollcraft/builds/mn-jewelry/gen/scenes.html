<!doctype html>
<!-- The home opening, drawn in code from their pieces' studio pictures (Tzvi, 10 Nov 2026: "make all the diamonds look real
     and high end ... and a great wow moment"). Light across the stone: their twist ring under a spotlight, a band of light
     crosses it and the stone flashes while the camera comes closer and the gold turns white, yellow, rose; four more of
     their pieces drift by in boxes; the ring comes back to the middle and settles. Every picture is their own piece
     (gen/studio_edit.py, gen/studio-brief.md); nothing here is drawn or 3D. Photographed frame by frame by gen/scenes.mjs
     (?w=1920&h=1080 or ?w=1080&h=1920, then window.at(seconds)); gen/film.sh makes the film. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: #121319; }
  #st { position: relative; overflow: hidden; }
  #hero, .bx { position: absolute; left: 0; top: 0; overflow: hidden; will-change: transform; }
  /* the ring's own studio ground melts into the velvet: it reads as a spotlight, never as a square */
  /* The box is wider than the picture (the picture is its middle 74%) and carries the picture's own ground tone, so the
     whole ring stays inside the round fade and no straight picture edge shows. The camera moves the whole box, fade included. */
  #hero { z-index: 5; background: linear-gradient(90deg, rgb(44,44,46) 13%, rgb(54,54,57) 87%); -webkit-mask-image: radial-gradient(circle closest-side, #000 66%, transparent 100%); mask-image: radial-gradient(circle closest-side, #000 66%, transparent 100%); }
  #pic { position: absolute; inset: 13%; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent), linear-gradient(180deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-composite: source-in; mask-composite: intersect; }
  #pic img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bx { box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); }
  .bx img { display: block; width: 100%; height: 100%; }
  #band { position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.2), rgba(255,255,255,0)); }
  /* the flash on the stone as the light crosses it */
  #star { position: absolute; left: 72%; top: 43%; width: 26%; height: 26%; margin: -13% 0 0 -13%;
    background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0) 16%),
      linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85) 50%, rgba(255,255,255,0)) center / 100% 2px no-repeat,
      linear-gradient(0deg, rgba(255,255,255,0), rgba(255,255,255,.85) 50%, rgba(255,255,255,0)) center / 2px 100% no-repeat; }
</style></head>
<body><div id="st">
  <div class="bx"><img src="../assets/p17-st.webp" alt=""></div>
  <div class="bx"><img src="../assets/p14-st.webp" alt=""></div>
  <div class="bx"><img src="../assets/p19-st.webp" alt=""></div>
  <div class="bx"><img src="../assets/p06-st.webp" alt=""></div>
  <div id="hero"><div id="pic"><img src="studio/p10.png" alt=""><img src="studio/p10-yellow.png" alt=""><img src="studio/p10-rose.png" alt=""><i id="star"></i></div><i id="band"></i></div>
</div>
<script>
const q = new URLSearchParams(location.search), W = +q.get('w') || 1920, H = +q.get('h') || 1080, tall = H > W, u = Math.min(W, H);
const st = document.getElementById('st'); st.style.width = W + 'px'; st.style.height = H + 'px';
// the ground is the page's own flat velvet: a wide glow across the whole film showed as faint straight lines in the video
const hero = document.getElementById('hero'), band = document.getElementById('band'), star = document.getElementById('star');
const [white, yellow, rose] = hero.querySelectorAll('img'), boxes = [...document.querySelectorAll('.bx')];
boxes.forEach((b) => { b.style.borderRadius = Math.round(u * 0.016) + 'px'; });
const E = (a, b, t) => Math.min(1, Math.max(0, (t - a) / (b - a))), ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2, L = (a, b, k) => a + (b - a) * k;
// s is the picture's side. A phone shows only the middle 82% of the tall film's width, so the ring (88% of its picture) stays inside it.
const F = tall ? { x: 0.5 * W, y: 0.69 * H, s: 0.82 * W } : { x: 0.64 * W, y: 0.5 * H, s: 0.76 * H };      // first: beside the words (under them on a phone)
const SM = tall ? { x: 0.5 * W, y: 0.5 * H, s: 0.5 * W } : { x: 0.64 * W, y: 0.5 * H, s: 0.42 * H };       // small, while the others pass
const END = tall ? { x: 0.5 * W, y: 0.42 * H, s: 0.8 * W } : { x: 0.55 * W, y: 0.42 * H, s: 0.84 * H };     // last: the middle, above their three words
const ZM = tall ? 0.06 : 0.18, PIC = 0.74;   // how far the camera comes in; the picture's share of its box
const B = tall ? 0.32 * W : 0.26 * H;   // small enough to stay whole where the page crops the film's sides
function box(el, x, y, s, o) { el.style.width = el.style.height = s + 'px'; el.style.transform = `translate(${x - s / 2}px, ${y - s / 2}px)`; el.style.opacity = o; }
const GLINTS = [[0.3, 1.3], [1.5, 2.4], [2.7, 3.6], [6.8, 7.8]];   // one pass of light at the start, at each gold, and at the end
window.at = (t) => {
  const sh = ease(E(3.6, 5.4, t)), gr = ease(E(5.8, 7.6, t)), P = (k) => L(L(F[k], SM[k], sh), END[k], gr);
  // on a phone the ring rises to the middle of the screen once the words above it have left
  const y0 = tall ? L(F.y, 0.5 * H, ease(E(0.3, 1.5, t))) : F.y, py = L(L(y0, SM.y, sh), END.y, gr);
  // the camera comes closer to the stone, eases back as the others pass, then a last slow push; the stone keeps its place
  const zoom = 1 + ZM * ease(E(0.5, 3.6, t)) - ZM * sh + 0.06 * ease(E(6.4, 8, t)), s0 = P('s'), s = s0 * zoom;
  box(hero, P('x') - 0.22 * s0 * (zoom - 1), py + 0.07 * s0 * (zoom - 1), s / PIC, 1);
  // each gold changes at the brightest moment of its pass of light, quickly, so two golds never show at once for long
  const back = 1 - ease(E(4.8, 5.1, t));   // back to white gold, the gold of their own photo
  yellow.style.opacity = t < 3.3 ? ease(E(1.85, 2.05, t)) : 0; rose.style.opacity = ease(E(3.05, 3.25, t)) * back;
  let bo = 0, so = 0, bx = 0;
  for (const [a, b] of GLINTS) { const k = (t - a) / (b - a); if (k > 0 && k < 1) { bo = Math.sin(Math.PI * k); bx = L(-0.4, 1.1, k); so = Math.max(0, 1 - Math.abs(k - 0.5) / 0.2); } }
  band.style.opacity = bo; band.style.transform = `translateX(${bx * s / PIC}px) skewX(-18deg)`;
  star.style.opacity = 0.75 * so; star.style.transform = `scale(${0.55 + 0.45 * so}) rotate(${18 * so}deg)`;
  // four more of their pieces drift by in boxes: two beside the ring going opposite ways (above and below it on a phone)
  const o = ease(E(3.9, 4.8, t)) * (1 - ease(E(5.9, 6.7, t))), d = (t - 5.2) * (tall ? 0.03 : 0.06);
  boxes.forEach((el, i) => {
    const side = i % 2, n = (i >> 1) - 0.5, dir = side ? 1 : -1;
    if (tall) box(el, 0.5 * W + n * 0.4 * W + dir * d * W, side ? 0.78 * H : 0.22 * H, B, o);
    else box(el, side ? 0.83 * W : 0.42 * W, 0.5 * H + n * 0.42 * H + dir * d * H, B, o);
  });
};
window.at(0);
</script></body></html>
